<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kakao Map</title>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
    #err {
      position: absolute; left: 12px; right: 12px; bottom: 12px;
      background: #FEF2F2; color: #991B1B; padding: 10px 12px;
      border-radius: 8px; font-family: sans-serif; font-size: 12px;
      display: none; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="err"></div>
  <script>
    function showError(msg) {
      var el = document.getElementById('err');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function postToParent(payload) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(JSON.stringify(payload), window.location.origin);
        }
      } catch (e) { /* ignore */ }
    }

    var params = new URLSearchParams(window.location.search);
    var lat = parseFloat(params.get('lat'));
    var lng = parseFloat(params.get('lng'));
    var key = params.get('key');
    var label = params.get('label') ? decodeURIComponent(params.get('label')) : '';

    var buildings = [];
    var buildingsRaw = params.get('buildings');
    if (buildingsRaw) {
      try {
        buildings = JSON.parse(decodeURIComponent(buildingsRaw));
        if (!Array.isArray(buildings)) buildings = [];
      } catch (e) {
        buildings = [];
      }
    }

    if (!key) {
      showError('Missing Kakao appkey.');
    } else if (isNaN(lat) || isNaN(lng)) {
      showError('Missing or invalid coordinates.');
    } else {
      var sdkUrl = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(key) + '&autoload=false';
      var script = document.createElement('script');
      script.src = sdkUrl;
      script.onload = function() {
        try {
          kakao.maps.load(function() {
            var center = new kakao.maps.LatLng(lat, lng);
            var map = new kakao.maps.Map(document.getElementById('map'), {
              center: center,
              level: 3
            });

            // 건물 마커가 없을 때만 중앙 라벨 마커 표시
            if (buildings.length === 0 && label) {
              var centerMarker = new kakao.maps.Marker({ position: center, map: map });
              var info = new kakao.maps.InfoWindow({
                content: '<div style="padding:6px 10px;font-size:13px;font-weight:600;">' + label + '</div>'
              });
              info.open(map, centerMarker);
            }

            function buildColoredMarkerImage(color) {
              var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="36" viewBox="0 0 26 36">' +
                '<path d="M13 0C5.8 0 0 5.8 0 13c0 9.7 13 23 13 23s13-13.3 13-23C26 5.8 20.2 0 13 0z" fill="' + color + '" stroke="white" stroke-width="2"/>' +
                '<circle cx="13" cy="13" r="4.5" fill="white"/>' +
                '</svg>';
              var dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
              return new kakao.maps.MarkerImage(
                dataUrl,
                new kakao.maps.Size(26, 36),
                { offset: new kakao.maps.Point(13, 36) }
              );
            }

            buildings.forEach(function(b) {
              var pos = new kakao.maps.LatLng(b.lat, b.lng);
              var opts = { position: pos, map: map, title: b.label };
              if (b.color) opts.image = buildColoredMarkerImage(b.color);
              var marker = new kakao.maps.Marker(opts);
              kakao.maps.event.addListener(marker, 'click', function() {
                postToParent({ type: 'markerClick', id: b.id });
              });
            });

            if (buildings.length > 0) {
              var bounds = new kakao.maps.LatLngBounds();
              buildings.forEach(function(b) {
                bounds.extend(new kakao.maps.LatLng(b.lat, b.lng));
              });
              map.setBounds(bounds);
            }

            map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
          });
        } catch (e) {
          showError('Map init error: ' + e.message);
        }
      };
      script.onerror = function() {
        // 응답 상태 코드를 추가 진단으로 가져오기
        fetch(sdkUrl, { method: 'GET' })
          .then(function(res) {
            return res.text().then(function(body) {
              var hint = '';
              if (res.status === 401 || /401/.test(body)) {
                hint = '\n→ 401 Unauthorized: JS 키가 잘못되었거나 카카오맵 제품이 비활성화됨.';
              } else if (res.status === 403 || /forbidden/i.test(body)) {
                hint = '\n→ 403 Forbidden: 현재 origin(' + window.location.origin + ')이 Kakao Console의 Web 플랫폼 도메인에 등록되지 않음.';
              }
              showError('Kakao SDK 응답: HTTP ' + res.status + ' from ' + window.location.origin + hint);
            });
          })
          .catch(function(err) {
            showError('Kakao SDK 네트워크 실패: ' + err.message + '\norigin=' + window.location.origin);
          });
      };
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
